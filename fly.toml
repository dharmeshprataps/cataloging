# ---------------------------------------------------------------------------
# Single always-on webhook service. Meta needs a stable public HTTPS endpoint,
# and generation takes tens of seconds, so a long-running instance is the
# simplest correct shape.
#
# Deploy:  fly launch --no-deploy  (keep this file)  then  fly deploy
# ---------------------------------------------------------------------------
app = "wa-catalog-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  # Start in the simulator channel; switch to "whatsapp" once credentials and a
  # webhook URL are in place.
  MESSAGING_CHANNEL = "simulator"
  STORAGE_DIR = "/data/uploads"
  DATABASE_PATH = "/data/bot.db"

[http_service]
  internal_port = 3000
  force_https = true
  # Required: webhook redelivery is expected behaviour, not a failure.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

# SQLite and uploaded images live here. Note the single-instance constraint:
# two machines sharing one SQLite file over a network filesystem is not safe.
[[mounts]]
  source = "wa_catalog_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "15s"
