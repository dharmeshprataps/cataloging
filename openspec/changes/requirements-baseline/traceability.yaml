# Machine-readable status index for requirements-baseline
#
# One line per requirement. Reviewers can grep this instead of scanning
# requirements.md; this change's `traceability-gate` gate enforces it.
#
#   id: { file, title, implementation, verification, tests, [gap], [finding] }
#
# Defaults, omitted when they apply: implementation=implemented,
# evidence=OBSERVED EVIDENCE.
#
# `verification` is required and must be stated; the gate rejects an entry that
# omits it. `verification: verified` means an automated test fails if the
# behaviour breaks — such a test's title begins with the id, the test is not
# skipped (nor inside a skipped suite), and its body contains at least one
# assertion. `unverified` means the behaviour is implemented but nothing in
# this tree proves it: say why in `gap` and link the `finding` that owns it.
#
# Scope note: this change lands the baseline and the gate, not the product test
# suite. Because the gate derives verification from evidence it can actually
# find, no requirement can claim `verified` here — every implemented behaviour
# reads `unverified` with a `gap` naming the expand-test-coverage change that
# carries its tests. That change restores these citations from evidence rather
# than from this file. A requirement with `verification: n/a` describes
# behaviour that does not exist yet, so it cites nothing by design.
#
# Values are unquoted, and this reader treats a quote character as opening a
# quoted string, so keep quotation marks out of `gap`/`title` text.
#
# Findings are F-001..F-003 (see findings/) and P-1..P-8 (see PROBLEMS.md).

